<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Usuário</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1 th:text="${user.id} != null ? 'Editar Usuário' : 'Novo Usuário'"></h1>
    <form th:action="${user.id} != null ? @{'/user/' + ${user.id}} : @{/user}" method="post" th:object="${user}">
        <label>Nome completo:
            <input type="text" id="name" name="name" th:field="*{name}" required />
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </label>
        <label>CPF:
            <input type="text" id="cpf" name="cpf" th:field="*{cpf}" maxlength="14" required />
            <span th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></span>
        </label>
        <label>E-mail:
            <input type="email" id="email" name="email" th:field="*{email}" required />
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </label>
        <label>Cargo:
            <input type="text" id="role" name="role" th:field="*{role}" required />
            <span th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span>
        </label>
        <label>Login:
            <input type="text" id="login" name="login" th:field="*{login}" required />
            <span th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></span>
        </label>
        <label>Senha:
            <input type="password" id="password" name="password" th:field="*{password}" required placeholder="Deixe em branco para manter a senha" />
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </label>
        <label>Perfil:
            <select th:field="*{profile}">
                <option value="" disabled selected>Selecione...</option>
                <option value="Administrador">Administrador</option>
                <option value="Gerente">Gerente</option>
                <option value="Colaborador">Colaborador</option>
            </select>
            <span th:if="${#fields.hasErrors('profile')}" th:errors="*{profile}"></span>
        </label>
        <div>
            <button type="submit">Salvar</button>
            <a th:href="@{/user}">Voltar</a>
        </div>
    </form>

    <script>
        document.getElementById("cpf")?.addEventListener("input", function (e) {
            let v = e.target.value.replace(/\D/g, "");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            e.target.value = v;
        });
    </script>
</body>
</html>
