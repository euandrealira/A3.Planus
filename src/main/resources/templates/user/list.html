<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Usuários</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Planus — Usuários</h1>
<nav>
    <ul>
        <li><a th:href="@{/}">Home</a></li>
        <li><a th:href="@{/team}">Equipes</a></li>
        <li><a th:href="@{/project}">Projetos</a></li>
    </ul>
</nav>
<a th:href="@{/user/new}">Novo usuário</a>
<table border="1" cellpadding="6">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome Completo</th>
            <th>CPF</th>
            <th>E-mail</th>
            <th>Cargo</th>
            <th>Perfil</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="u: ${users}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.name}"></td>
            <td th:text="${u.cpf}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.role}"></td>
            <td th:text="${u.profile}"></td>
            <td>
                <div class="list-actions">
                    <a th:href="@{'/user/' + ${u.id} + '/edit'}">Editar</a>
                    <form th:action="@{'/user/' + ${u.id} + '/delete'}" method="post" style="display:inline">
                        <button type="submit">Excluir</button>
                    </form>
                </div>
            </td>
        </tr>
    </tbody>
</table>
</body>
</html>
